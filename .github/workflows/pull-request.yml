name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@main
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # Cross-runtime loadability of the built package. A separate job id (not `code`) so the
  # required `code / all-checks` context is untouched.
  runtimes:
    uses: ./.github/workflows/runtimes.yml
